{% extends 'base.html' %}{% block title %}Desempenho - Biblioteca digital Estudantil{% endblock %}
{% block content %}<section class="form-page"><h1>Meu desempenho</h1><div class="form-card"><label>ID do usuário<input id="usuario" type="number" placeholder="ID do usuário"></label><button class="orange-btn" onclick="carregar()">Consultar</button></div><div id="relatorio"></div><div id="evolucao"></div><div id="fraca"></div></section>{% endblock %}{% block scripts %}<script>async function carregar(){const id=document.getElementById('usuario').value;if(!id)return;const [r,e,c]=await Promise.all([fetch(`/api/alunos/${id}/relatorio`).then(x=>x.json()),fetch(`/api/alunos/${id}/evolucao`).then(x=>x.json()),fetch(`/api/alunos/${id}/competencia-fraca`).then(x=>x.json())]);document.getElementById('relatorio').innerHTML=`<div class="cards"><div class="card"><h2>${r.nome||'-'}</h2><p>Redações: ${r.total_redacoes||0}</p></div><div class="card"><h2>${r.media||0}</h2><p>Média</p></div><div class="card"><h2>${r.melhor_nota||0}</h2><p>Melhor nota</p></div><div class="card"><h2>${r.menor_nota||0}</h2><p>Menor nota</p></div></div>`;document.getElementById('evolucao').innerHTML='<h2>Evolução</h2>'+e.map(x=>`<div class="card"><b>${x.tema}</b> — ${x.nota_total} — ${x.data_envio}</div>`).join('');document.getElementById('fraca').innerHTML=`<div class="card"><h2>Competências</h2><p>C1: ${c.competencia1||0}</p><p>C2: ${c.competencia2||0}</p><p>C3: ${c.competencia3||0}</p><p>C4: ${c.competencia4||0}</p><p>C5: ${c.competencia5||0}</p></div>`}</script>{% endblock %}
