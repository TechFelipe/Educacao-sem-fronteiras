{% extends 'base.html' %}{% block title %}Redação - Biblioteca digital Estudantil{% endblock %}
{% block content %}<section class="form-page"><h1>Enviar redação</h1><div class="form-card"><label>Seu ID<input id="usuario" type="number" placeholder="ID do usuário"></label><label>ID do tema<input id="tema" type="number" placeholder="ID do tema"></label><label>Redação<textarea id="texto" rows="15" placeholder="Digite sua redação aqui..."></textarea></label><button class="orange-btn" onclick="enviar()">Enviar redação</button><p id="msg"></p></div></section>{% endblock %}{% block scripts %}<script>async function enviar(){const dados={usuario_id:Number(document.getElementById('usuario').value),tema_id:Number(document.getElementById('tema').value),texto:document.getElementById('texto').value};const res=await fetch('/api/redacoes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)});const json=await res.json();document.getElementById('msg').textContent=json.erro||'Redação enviada com sucesso!';}</script>{% endblock %}
