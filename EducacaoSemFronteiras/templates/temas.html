{% extends 'base.html' %}{% block title %}Matérias - Biblioteca digital Estudantil{% endblock %}
{% block content %}<section class="page"><div class="search-row"><input id="termo" class="search" placeholder=""><button class="search-icon" onclick="buscar()">⌕</button></div><div class="subject-grid" id="subjects"><a class="subject" href="#" data-subject="Português">Português</a><a class="subject" href="#" data-subject="Matemática">Matemática</a><a class="subject" href="#" data-subject="Física">Física</a><a class="subject" href="#" data-subject="História">História</a><a class="subject" href="#" data-subject="Geografia">Geografia</a><a class="subject" href="#" data-subject="Biologia">Biologia</a><a class="subject" href="#" data-subject="Química">Química</a><a class="subject" href="#" data-subject="Filosofia">Filosofia</a><a class="subject" href="#" data-subject="Artes">Artes</a><a class="subject" href="#" data-subject="Sociologia">Sociologia</a><a class="subject" href="#" data-subject="Inglês">Inglês</a><a class="subject" href="#" data-subject="Ver mais">Ver mais</a></div><div id="resultado"></div></section>{% endblock %}{% block scripts %}<script>async function buscar(){const termo=document.getElementById('termo').value.trim();if(!termo){document.getElementById('resultado').innerHTML='';document.querySelectorAll('.subject').forEach(x=>x.style.display='block');return}const res=await fetch('/api/temas/buscar?termo='+encodeURIComponent(termo));const dados=await res.json();document.querySelectorAll('.subject').forEach(x=>x.style.display='none');document.getElementById('resultado').innerHTML=dados.map(t=>`<div class="card"><h2>${t.titulo}</h2><p>${t.descricao||''}</p><small>Dificuldade: ${t.dificuldade||'-'}</small></div>`).join('')||'<div class="notice">Nenhum material encontrado.</div>'}document.querySelectorAll('.subject').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();const s=btn.dataset.subject;if(s==='Ver mais'){document.querySelectorAll('.subject').forEach(x=>x.style.display='block');return}document.getElementById('termo').value=s;buscar() }));const initial=new URLSearchParams(location.search).get('termo');if(initial){document.getElementById('termo').value=initial;buscar()}</script>{% endblock %}
