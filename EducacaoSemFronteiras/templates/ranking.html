{% extends 'base.html' %}{% block title %}Ranking - Biblioteca digital Estudantil{% endblock %}
{% block content %}<section class="page"><h1>Ranking</h1><div id="ranking" class="ranking-list"></div></section>{% endblock %}{% block scripts %}<script>fetch('/api/redacoes/ranking').then(r=>r.json()).then(d=>{document.getElementById('ranking').innerHTML=d.map((x,i)=>`<div class="rank-card"><strong>#${i+1} — ${x.nome}</strong><span>Redações: ${x.quantidade_redacoes} · Média: <b>${x.media}</b></span></div>`).join('')||'<div class="notice">Ainda não há dados no ranking.</div>'}).catch(()=>document.getElementById('ranking').innerHTML='<div class="notice">Não foi possível carregar o ranking.</div>')</script>{% endblock %}
