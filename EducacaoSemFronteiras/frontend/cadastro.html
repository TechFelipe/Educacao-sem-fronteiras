
<!DOCTYPE html>
<html lang="pt-BR">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar - Biblioteca digital Estudantil</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/common.js" defer></script>
    <script src="/static/js/cadastro.js" defer></script>
</head>
<body>
    <div id="site-header"></div>
    <main><section class="auth-panel standalone">
    <div class="auth-form"><h1>Cadastrar</h1>
    <form id="cadastroForm" class="auth-form-fields">
    <label>Email<input name="email" type="email" autocomplete="email" required></label>
    <label>Senha<input id="cadastroSenha" name="senha" type="password" autocomplete="new-password" required minlength="6"></label>
    <label class="check"><input type="checkbox" onclick="togglePassword('cadastroSenha')"> Exibir senha</label>
    <label>Confirmar Senha<input id="confirmarSenha" name="confirmar_senha" type="password" autocomplete="new-password" required minlength="6"></label>
    <label class="check"><input type="checkbox" onclick="togglePassword('confirmarSenha')"> Exibir senha</label>
    <button class="orange-btn" type="submit">Cadastrar</button><div id="msg"></div>
</form><p>Já possui uma conta?<br><a href="/login">Logue</a> agora!</p>
</div><div class="auth-art"><div class="big-logo">📖</div></div></section></main>
</body>
</html>
