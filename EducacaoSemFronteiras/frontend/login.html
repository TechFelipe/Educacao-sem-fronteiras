<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer login - Biblioteca digital Estudantil</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/common.js" defer></script>
    <script src="/static/js/login.js" defer></script>
</head>

<body>
    <iframe class="header-frame" src="/cabecalho" title="Cabeçalho e navegação" scrolling="no" loading="eager"></iframe>
    <main>
        <section class="auth-panel standalone">
            <div class="auth-form">
                <h1>Fazer login</h1>
                <form id="loginForm" class="auth-form-fields">
                    <label>Email<input id="email" name="email" type="email" autocomplete="email" required></label>
                    <label>Senha<input id="senha" name="senha" type="password" autocomplete="current-password"
                            required></label>
                    <label class="check"><input type="checkbox" data-toggle-password="senha"> Exibir senha</label>
                    <button class="orange-btn" type="submit">Entrar</button>
                    <div id="msg"></div>
                </form>
                <p>Não possui uma conta?<br><a href="/cadastro">Cadastre-se</a> agora!</p>
            </div>
            <div class="auth-art">
                <div class="big-logo">📖</div>
            </div>
        </section>
    </main>

</body>

</html>
