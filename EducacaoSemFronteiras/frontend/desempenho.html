<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu desempenho - Biblioteca digital Estudantil</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/common.js" defer></script>
    <script src="/static/js/desempenho.js" defer></script>
</head>

<body>
    <iframe class="header-frame" src="/cabecalho" title="Cabeçalho e navegação" scrolling="no" loading="eager"></iframe>

    <main>
        <section class="form-page">

            <h1>Meu desempenho</h1>

            <p>
                Consulte suas redações, notas e evolução.
                Os dados são carregados usando sua conta.
            </p>

            <div class="form-card">

                <!-- O nome da conta será preenchido automaticamente. -->
                <p id="identificacao-usuario" aria-live="polite">
                    Identificando sua conta...
                </p>

                <!-- Exibe carregamento, erros e mensagens de sucesso. -->
                <p id="status-desempenho" role="status" aria-live="polite">
                    Carregando seu desempenho...
                </p>

                <!-- Atualiza o relatório sem solicitar o ID do usuário. -->
                <button class="orange-btn" id="consultar-desempenho" type="button">
                    Atualizar meu desempenho
                </button>

            </div>

            <!-- O JavaScript preencherá estas áreas com os resultados da API. -->
            <section id="relatorio" aria-label="Resumo do desempenho"></section>

            <section id="evolucao" aria-label="Evolução das redações"></section>

            <section id="fraca" aria-label="Notas por competência"></section>

        </section>
    </main>

</body>

</html>
