<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redação - Biblioteca digital Estudantil</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/common.js" defer></script>
    <script src="/static/js/redacao.js" defer></script>
</head>

<body>
    <iframe class="header-frame" src="/cabecalho" title="Cabeçalho e navegação" scrolling="no" loading="eager"></iframe>

    <main>
        <section class="form-page">
            <h1>Enviar redação</h1>

            <div class="form-card">
                <!-- O ID do usuário fica oculto: o JavaScript tenta obtê-lo pela sessão da API. -->
                <input id="usuario" type="hidden">

                <!--
                    A lista de temas será preenchida pelo JavaScript com dados vindos da API Flask.
                    Cada tema será apresentado como checkbox, sem exigir que o aluno digite um ID.
                    O JavaScript limita a seleção a um único tema, pois cada redação pertence a um tema.
                -->
                <fieldset id="selecao-temas" class="theme-selection">
                    <legend>Escolha o tema da redação</legend>
                    <p id="estado-temas" role="status">Carregando temas...</p>
                    <div id="lista-temas">
                        <!-- Os checkboxes são inseridos aqui após a resposta da API. -->
                    </div>
                </fieldset>

                <!-- Este resumo é atualizado quando o aluno marca um checkbox. -->
                <div id="mutavel" aria-live="polite">
                    <p id="tema-selecionado">Tema da redação: nenhum selecionado</p>
                    <p id="dificuldade-selecionada">Nível de dificuldade: -</p>
                </div>

                <label for="texto">Redação
                    <textarea id="texto" rows="15" placeholder="Digite sua redação aqui..."></textarea>
                </label>

                <button class="orange-btn" id="enviar-redacao" type="button">
                    Enviar redação
                </button>
                <p id="msg" role="status" aria-live="polite"></p>
            </div>
        </section>
    </main>
</body>

</html>
