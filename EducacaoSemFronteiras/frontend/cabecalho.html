<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabeçalho - Biblioteca digital Estudantil</title>
    <link rel="stylesheet" href="/static/css/cabecalho.css">
    <script src="/static/js/cabecalho.js" defer></script>
</head>
<body>
    <!-- Faixa superior laranja do cabeçalho antigo. -->
    <header class="topbar">
        <a class="brand" href="/dashboard" target="_top"
           aria-label="Biblioteca digital Estudantil - Início">
            <span class="brand-logo" aria-hidden="true">📖</span>
            <span class="brand-name">Biblioteca digital Estudantil</span>
        </a>

        <div class="top-actions">
            <!-- O JavaScript consulta a sessão Flask e mostra usuário ou login. -->
            <div id="user-area">
                <a class="user-button login-placeholder" href="/login" target="_top">♙</a>
            </div>

            <!-- Este item permanece fora do menu lateral, no cabeçalho. -->
            <a class="icon-button sparkle" href="/assistente" target="_top"
               aria-label="Assistente virtual">✧</a>

            <!-- O clique avisa a página principal para abrir o menu sobre o conteúdo. -->
            <button class="hamburger" id="toggle-side-menu" type="button"
                    aria-label="Abrir menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <!-- Faixa vermelha de navegação antiga: estes links continuam fora do menu lateral. -->
    <nav class="main-nav" aria-label="Navegação principal">
        <a href="/dashboard" target="_top">Início</a>
        <a href="/temas" target="_top">Matérias</a>
        <a href="/gerenciar-temas" target="_top">Gerenciar temas</a>
        <a href="/gerenciar-materiais" target="_top">Gerenciar PDFs</a>
        <a href="/assistente" target="_top">Assistente Virtual</a>
    </nav>
</body>
</html>
