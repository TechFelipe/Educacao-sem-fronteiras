<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Virtual - Biblioteca digital Estudantil</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/common.js" defer></script>
    <script src="/static/js/assistente.js" defer></script>
</head>

<body>
    <iframe class="header-frame" src="/cabecalho" title="Cabeçalho e navegação" scrolling="no" loading="eager"></iframe>
    <main>
        <section class="assistant">
            <aside class="assistant-sidebar">
                <a href="#">✎ &nbsp; Nova tarefa</a><a href="#">▱ &nbsp; Galeria</a>
                <hr>
                <a href="#">Conversas anteriores</a>
                <hr><button>Sair do chat</button><button>Estudar sozinho</button><button type="button"
                    id="deslogar-assistente">Deslogar</button>
            </aside>
            <div class="assistant-main">
                <h1>Seja bem vindo, o que deseja aprender hoje?</h1>
                <div class="review-box"><strong>Iniciar revisão</strong>
                    <div class="review-controls"><span class="plus">⊕</span><select class="review-select">
                            <option>Revisão</option>
                            <option>Questões</option>
                            <option>Resumo</option>
                        </select></div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
